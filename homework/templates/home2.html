<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>할일 앱에 오신 것을 환영합니다</title>
</head>
<body>
    <h1>할일 앱에 오신 것을 환영합니다!</h1>
    <p>이것은 김현준의 애플리케이션입니다.</p>
    <a href="/">클릭</a>하시면 처음 페이지로 이동합니다.
    <ul>
      {% for todo in todos %}
        <li>{{ todo.task }} (우선순위: {{ todo.priority }}, 완료: {{ "O" if todo.done else "X" }})</li>
      {% else %}
        <li>할 일이 없습니다.</li>
      {% endfor %}
    </ul>
</body>
</html>
